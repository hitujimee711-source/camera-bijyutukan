<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json"><title>カメラメモ</title><style>
:root{font-size:20px;--bg:#fff;--fg:#000;--yellow:#f2f2f2;--cyan:#005fcc;--panel:#fff;--field:#fff;--border:#000}.theme-invert{--bg:#000;--fg:#fff;--yellow:#161616;--cyan:#00e5ff;--panel:#101010;--field:#161616;--border:#fff}.theme-high{--bg:#000;--fg:#ffff00;--yellow:#ffff00;--cyan:#00ffff;--panel:#000;--field:#000;--border:#ffff00}.theme-high .btn{color:#000}.theme-high .capture-btn{background:#00ffff!important;color:#000!important;border-color:#fff!important;box-shadow:0 0 0 5px #00ffff}.theme-high .secondary,.theme-high .danger{background:#ffff00;color:#000}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}main{max-width:900px;margin:auto;padding:18px}h1{font-size:2.1rem}h2{margin-top:36px}.jump-box{margin:8px 0 24px;padding:14px;border:3px solid var(--border);border-radius:14px;background:var(--panel)}.jump-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,1fr);gap:14px;align-items:end}.jump-box label{display:block;font-size:26px;font-weight:900}.jump-box input{width:100%;min-height:68px;padding:10px 14px;border:3px solid var(--border);border-radius:12px;background:var(--field);color:var(--fg);font-size:31px;font-weight:700}.jump-target{scroll-margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{width:100%;min-height:68px;margin:8px 0;padding:12px;border:3px solid var(--border);border-radius:14px;background:var(--yellow);color:var(--fg);font:700 1.5rem/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.capture-btn{background:#e60000!important;color:#fff!important;border:5px solid #fff!important;font-size:1.7rem!important;font-weight:900!important;box-shadow:0 0 0 5px #e60000}.capture-btn:focus{outline:6px solid #00ffff;outline-offset:5px}.secondary{background:var(--panel);color:var(--fg)}.danger{background:var(--panel);color:var(--fg)}button:focus,textarea:focus,input:focus{outline:5px solid var(--cyan);outline-offset:3px}textarea{width:100%;min-height:170px;padding:14px;border:3px solid var(--border);border-radius:12px;background:var(--field);color:var(--fg);font:1.1rem/1.5 inherit}#memo{font-size:31px!important;line-height:1.6!important}.stage{display:none;margin:14px 0;padding:12px;border:3px solid var(--border);border-radius:14px}.stage.show{display:block}video,img.preview{width:100%;max-height:55vh;object-fit:contain;background:var(--panel);border-radius:8px}.status{font-weight:700;min-height:2em}.record{position:relative;border:3px solid var(--border);border-radius:14px;padding:14px;margin:16px 0;background:var(--panel)}.record.favorite{padding-top:88px;border:8px solid #ff9900;box-shadow:0 0 0 5px #000,0 0 0 9px #ff9900}.award{position:absolute;right:12px;top:12px;z-index:2;background:#ffcc00;color:#000;border:4px solid #000;border-radius:999px;padding:8px 12px;font-size:26px;font-weight:900}.favorite-note{font-size:26px;font-weight:900;color:#ff9900}.theme-high .record.favorite{border-color:#00ffff;box-shadow:0 0 0 5px #000,0 0 0 9px #00ffff}.theme-high .favorite-note{color:#00ffff}.record img{max-width:100%;max-height:360px;object-fit:contain}.record-number{font-size:34px;font-weight:900;margin:0 0 10px}.record time{color:var(--yellow);font-weight:700}.theme-switch{position:absolute;top:10px;right:10px;width:auto;min-height:52px;margin:0;padding:8px 12px;font-size:23px}.big{font-size:26px}@media(max-width:600px){.jump-row,.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main><button class="btn theme-switch" id="theme" type="button" aria-live="polite">配色：通常</button><h1>カメラメモ</h1><section class="jump-box" aria-labelledby="jumpTitle"><div id="jumpTitle" style="font-size:26px;font-weight:900">記録番号へ移動</div><div class="jump-row"><div><label for="jumpNumber">記録番号</label><input id="jumpNumber" type="number" min="1" inputmode="numeric" placeholder="例：3"></div><button class="btn" id="jumpBtn" type="button">記録へジャンプ</button></div></section><p>写真と文章を端末内に保存します。通信がなくても記録できます。</p><button class="btn" id="size">文字を大きくする</button><h2>1. 写真</h2><div class="grid"><button class="btn" id="openCamera">📷 カメラで撮影</button><button class="btn" id="pickPhoto">🖼️ 写真を選ぶ</button></div><input id="file" type="file" accept="image/*" hidden><section id="cameraStage" class="stage" aria-label="カメラ"><video id="video" autoplay playsinline muted></video><div class="grid"><button class="btn capture-btn" id="shoot">📸 撮影する</button><button class="btn secondary" id="closeCamera">カメラを閉じる</button></div></section><section id="previewStage" class="stage"><p><strong>選択中の写真</strong></p><img id="preview" class="preview" alt="記録する写真のプレビュー"><button class="btn secondary" id="removePhoto">写真を取り消す</button></section><canvas id="canvas" hidden></canvas><h2><label for="memo">2. メモを書く</label></h2><textarea id="memo" placeholder="ここにメモを書きます。iPadの音声入力も使えます。"></textarea><button class="btn" id="save">💾 記録する</button><p id="status" class="status" role="status" aria-live="polite"></p><h2>これまでの記録</h2><div id="records"></div><button class="btn danger" id="clear">すべての記録を削除</button></main><script>
const $=x=>document.getElementById(x);let stream=null,photoBlob=null;const themes=[{name:'通常',cls:''},{name:'白黒反転',cls:'theme-invert'},{name:'ハイコントラスト',cls:'theme-high'}];let themeIndex=0;function applyTheme(){document.documentElement.classList.remove('theme-invert','theme-high');if(themes[themeIndex].cls)document.documentElement.classList.add(themes[themeIndex].cls);$('theme').textContent='配色：'+themes[themeIndex].name;$('theme').setAttribute('aria-label','配色 '+themes[themeIndex].name+'。押すと次の配色に切り替え');} const DB='CameraMemoDB',STORE='records';
function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function add(v){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).add(v);r.onsuccess=ok;r.onerror=()=>no(r.error)})}async function del(id){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}async function updateFavorite(id,favorite){const d=await db();return new Promise((ok,no)=>{const tx=d.transaction(STORE,'readwrite'),st=tx.objectStore(STORE),g=st.get(id);g.onsuccess=()=>{const x=g.result;if(!x){no(new Error('record not found'));return}x.favorite=favorite;const r=st.put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)};g.onerror=()=>no(g.error)})}async function updateRecord(id,memo,photo){const d=await db();return new Promise((ok,no)=>{const tx=d.transaction(STORE,'readwrite'),st=tx.objectStore(STORE),g=st.get(id);g.onsuccess=()=>{const x=g.result;if(!x){no(new Error('record not found'));return}x.memo=memo;x.photo=photo;const r=st.put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)};g.onerror=()=>no(g.error)})}async function clearDB(){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function say(s){$('status').textContent=s}function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('cameraStage').classList.remove('show')}function showBlob(b){photoBlob=b;$('preview').src=URL.createObjectURL(b);$('previewStage').classList.add('show')}
$('openCamera').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){say('この環境ではカメラを直接起動できません。HTTPSのGitHub Pagesから開いてください。');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('cameraStage').classList.add('show');say('カメラを起動しました。')}catch(e){say('カメラを起動できません。ブラウザのカメラ許可を確認してください。')}};$('closeCamera').onclick=()=>{stopCam();say('カメラを閉じました。')};$('shoot').onclick=()=>{const v=$('video'),c=$('canvas');if(!v.videoWidth){say('カメラ映像を待っています。');return}const max=1600,scale=Math.min(1,max/v.videoWidth);c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{showBlob(b);stopCam();say('撮影しました。')},'image/jpeg',.82)};
$('pickPhoto').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];if(f){showBlob(f);say('写真を選びました。')}};$('removePhoto').onclick=()=>{photoBlob=null;$('preview').removeAttribute('src');$('previewStage').classList.remove('show');$('file').value='';say('写真を取り消しました。')};
async function render(){const data=(await all()).sort((a,b)=>b.id-a.id),box=$('records');box.textContent='';if(!data.length){box.textContent='記録はまだありません。';return}for(const x of data){const number=data.length-data.indexOf(x);const a=document.createElement('article');a.className='record'+(x.favorite?' favorite':'');a.id='record-'+number;a.classList.add('jump-target');a.setAttribute('tabindex','-1');a.setAttribute('aria-label',(x.favorite?'お気に入りに登録された ':'')+'記録 '+number+' 番');if(x.favorite){const award=document.createElement('div');award.className='award';award.setAttribute('aria-hidden','true');award.textContent='★ お気に入り';a.append(award)}const num=document.createElement('p');num.className='record-number';num.textContent='記録 '+number+' 番';a.append(num);const t=document.createElement('time');t.textContent=new Date(x.created).toLocaleString('ja-JP');a.append(t);if(x.photo){const im=document.createElement('img');im.src=URL.createObjectURL(x.photo);im.alt='記録した写真';a.append(im)}const p=document.createElement('p');p.textContent=x.memo||'（メモなし）';a.append(p);if(x.favorite){const favNote=document.createElement('p');favNote.className='favorite-note';favNote.textContent='★ お気に入りに登録されています';favNote.setAttribute('role','status');a.append(favNote)}const editBtn=document.createElement('button');editBtn.className='btn secondary';editBtn.type='button';editBtn.textContent='✏️ この記録を編集';a.append(editBtn);const editBox=document.createElement('div');editBox.className='edit-box';editBox.hidden=true;const editLabel=document.createElement('label');editLabel.textContent='メモを編集';editLabel.style.fontWeight='900';const editText=document.createElement('textarea');editText.value=x.memo||'';editText.setAttribute('aria-label','記録 '+number+' 番のメモを編集');editLabel.append(editText);editBox.append(editLabel);const photoLabel=document.createElement('label');photoLabel.className='btn secondary edit-photo';photoLabel.textContent='🖼️ 写真を変更';const editFile=document.createElement('input');editFile.type='file';editFile.accept='image/*';editFile.hidden=true;photoLabel.append(editFile);editBox.append(photoLabel);let newPhoto=x.photo;editFile.onchange=()=>{const f=editFile.files&&editFile.files[0];if(f){newPhoto=f;say('記録 '+number+' 番の新しい写真を選びました。保存すると変更されます。')}};const remove=document.createElement('button');remove.className='btn secondary';remove.type='button';remove.textContent='写真を削除';remove.onclick=()=>{newPhoto=null;say('記録 '+number+' 番の写真を削除する設定にしました。保存すると反映されます。')};editBox.append(remove);const saveEdit=document.createElement('button');saveEdit.className='btn';saveEdit.type='button';saveEdit.textContent='💾 編集内容を保存';saveEdit.onclick=async()=>{await updateRecord(x.id,editText.value.trim(),newPhoto);say('記録 '+number+' 番を更新しました。');await render()};editBox.append(saveEdit);const cancelEdit=document.createElement('button');cancelEdit.className='btn secondary';cancelEdit.type='button';cancelEdit.textContent='編集をキャンセル';cancelEdit.onclick=()=>{editBox.hidden=true;editBtn.setAttribute('aria-expanded','false');editBtn.focus()};editBox.append(cancelEdit);a.append(editBox);editBtn.setAttribute('aria-expanded','false');editBtn.onclick=()=>{editBox.hidden=!editBox.hidden;editBtn.setAttribute('aria-expanded',String(!editBox.hidden));if(!editBox.hidden)editText.focus()};const fav=document.createElement('button');fav.className='btn';fav.type='button';fav.textContent=x.favorite?'★ お気に入りを解除':'☆ お気に入りに登録';fav.setAttribute('aria-pressed',String(!!x.favorite));fav.onclick=async()=>{await updateFavorite(x.id,!x.favorite);say(!x.favorite?'お気に入りに登録しました。':'お気に入りを解除しました。');await render()};a.append(fav);const speak=document.createElement('button');speak.className='btn';speak.type='button';speak.textContent='🔊 このメモを読み上げる';speak.setAttribute('aria-label','この記録のメモを読み上げる');speak.onclick=()=>{if(!('speechSynthesis' in window)){say('読み上げに対応していません。');return}speechSynthesis.cancel();const speech='記録 '+number+' 番。'+(x.favorite?'お気に入りに登録されています。':'')+(x.memo||'メモは入力されていません。');const u=new SpeechSynthesisUtterance(speech);u.lang='ja-JP';speechSynthesis.speak(u)};a.append(speak);const b=document.createElement('button');b.className='btn secondary';b.textContent='この記録を削除';b.onclick=async()=>{await del(x.id);await render();say('記録を削除しました。')};a.append(b);box.append(a)}}
$('save').onclick=async()=>{const text=$('memo').value.trim();if(!photoBlob&&!text){say('写真またはメモを入力してください。');return}try{await add({created:Date.now(),memo:text,photo:photoBlob});$('memo').value='';photoBlob=null;$('previewStage').classList.remove('show');$('preview').removeAttribute('src');$('file').value='';await render();say('端末内に記録しました。')}catch(e){say('保存できませんでした。端末の空き容量を確認してください。')}};$('clear').onclick=async()=>{if(confirm('すべての記録を削除しますか？元に戻せません。')){await clearDB();await render();say('すべての記録を削除しました。')}};$('size').onclick=e=>{const on=document.documentElement.classList.toggle('big');e.target.textContent=on?'文字を標準に戻す':'文字を大きくする'};
$('jumpBtn').onclick=()=>{const n=parseInt($('jumpNumber').value,10);if(!Number.isInteger(n)||n<1){say('移動したい記録番号を入力してください。');$('jumpNumber').focus();return}const target=$('record-'+n);if(!target){say('記録 '+n+' 番は見つかりません。');$('jumpNumber').focus();return}target.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>target.focus(),350);say('記録 '+n+' 番へ移動しました。')};$('jumpNumber').addEventListener('keydown',e=>{if(e.key==='Enter')$('jumpBtn').click()});$('theme').onclick=()=>{themeIndex=(themeIndex+1)%themes.length;applyTheme()};applyTheme();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>say('オフライン機能の準備に失敗しました。')));render();
</script></body></html>
